name: OpenCodeGo
options:
  bundleIdPrefix: com.timwilliams
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 7NHJT99NX8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
packages:
  # Auto-update for the direct/brew-distributed Mac app. Pinned exactly;
  # bump deliberately alongside SPARKLE_VERSION in scripts/release.sh.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
targets:
  MacCompanion:
    type: application
    platform: macOS
    sources: [MacCompanion, GoKit]
    dependencies:
      - package: Sparkle
    entitlements:
      path: MacCompanion/MacCompanion.entitlements
      properties:
        # Not sandboxed: the companion spawns the opencode CLI, which reads
        # the user's real repos and shells out freely. Direct distribution,
        # like Tomte's Mac half.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # Pairing rendezvous: public keys and device names only, in the
        # user's own private CloudKit database (GoKit/Pairing).
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.timwilliams.opencodego
    info:
      path: MacCompanion/Info.plist
      properties:
        CFBundleDisplayName: OpenCode Go
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Menu bar only — no Dock icon, no app switcher entry.
        LSUIElement: true
        # Sparkle: the appcast lives in the repo next to the releases the
        # dmgs are attached to. SUPublicEDKey is the public half of the
        # keypair scripts/setup-signing-key.sh puts in the login keychain —
        # release.sh refuses to build while it's the placeholder.
        SUFeedURL: https://raw.githubusercontent.com/tjameswilliams/opencodego/master/dist/updates/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_KEY
        SUEnableAutomaticChecks: true
        NSLocalNetworkUsageDescription: >-
          OpenCode Go serves your coding agent to your paired iPhone on your
          local network.
        NSBonjourServices: ["_opencodego._tcp"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timwilliams.opencodego.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  Phone:
    type: application
    platform: iOS
    sources: [Phone, GoKit]
    entitlements:
      path: Phone/Phone.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.timwilliams.opencodego
        # CloudKit-routed pushes (Attention records → APNs). The signing
        # step swaps development for production in distribution builds.
        aps-environment: development
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: OpenCode Go
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app's own crypto is the pairing channel — Curve25519/ChaChaPoly
        # via CryptoKit — plus HTTPS and CloudKit, all OS-provided: exactly
        # the export-compliance exemption this key claims.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: >-
          OpenCode Go connects to your Mac on your local network to run your
          coding agent. Your code never leaves your machines.
        NSBonjourServices: ["_opencodego._tcp"]
        NSFaceIDUsageDescription: >-
          OpenCode Go confirms it's you before approving the agent's
          commands.
        # Dictating a prompt. Recognition is pinned on-device (see
        # Dictation.swift) — the audio never leaves the phone.
        NSMicrophoneUsageDescription: >-
          OpenCode Go uses the microphone so you can dictate prompts to your
          coding agent.
        NSSpeechRecognitionUsageDescription: >-
          OpenCode Go transcribes your dictated prompts on this device.
          Nothing is sent to Apple or anyone else.
        # Attaching a photo of a screen, a whiteboard, an error. The image
        # goes to your own Mac and nowhere else. The photo library needs no
        # entry — the system picker runs out of process.
        NSCameraUsageDescription: >-
          OpenCode Go uses the camera so you can send your agent a photo —
          a screenshot, a diagram, an error on another screen.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timwilliams.opencodego.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
